<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kairos Dashboard</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --sidebar-bg: #1a1a1a;
            --card-bg: #222;
            --accent: #00f2ff;
            --text: #fff;
            --text-dim: #aaa;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar: Video List */
        .sidebar {
            width: 350px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
        }

        .logo {
            width: 28px;
            height: 28px;
            fill: var(--accent);
            margin-right: 12px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .video-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .video-item {
            padding: 16px;
            background-color: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .video-item:hover {
            transform: translateY(-2px);
            background-color: #2a2a2a;
        }

        .video-item.active {
            border-color: var(--accent);
            background-color: rgba(0, 242, 255, 0.05);
        }

        .video-item-title {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-item-meta {
            font-size: 12px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
        }

        /* Main Content: Notes View */
        .main {
            flex: 1;
            padding: 40px 60px;
            overflow-y: auto;
            max-width: 900px;
            margin: 0 auto;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-dim);
            opacity: 0.5;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            fill: currentColor;
        }

        .note-header {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .note-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .note-actions {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .action-btn.primary {
            background: var(--accent);
            color: black;
            font-weight: 500;
        }

        .timeline {
            position: relative;
            padding-left: 24px;
            border-left: 2px solid rgba(255,255,255,0.1);
        }

        .note-entry {
            position: relative;
            margin-bottom: 32px;
        }

        .timestamp-dot {
            position: absolute;
            left: -31px; /* 24px padding + 2px border + 5px radius */
            top: 4px;
            width: 12px;
            height: 12px;
            background: var(--bg);
            border: 2px solid var(--accent);
            border-radius: 50%;
        }

        .timestamp {
            font-family: monospace;
            color: var(--accent);
            font-size: 14px;
            margin-bottom: 8px;
            display: block;
        }

        .content {
            font-size: 16px;
            line-height: 1.6;
            color: #ddd;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="header">
            <svg class="logo" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
            <h1>Kairos Library</h1>
        </div>
        <div class="video-list" id="videoList">
            <!-- Video Items injected here -->
        </div>
    </div>

    <div class="main" id="mainContent">
        <div class="empty-state">
            <svg viewBox="0 0 24 24"><path d="M19 5v14H5V5h14m0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
            <p>Select a video to view notes</p>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
