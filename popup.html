<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --kairos-bg: #15171a;
      --kairos-text: #ffffff;
      --kairos-accent-start: #4fb6c8;
      --kairos-accent-end: #5a7bd8;
      --kairos-accent-ink: #0d1418;
      --kairos-surface: #1b1d21;
      --kairos-surface-border: rgba(255, 255, 255, 0.08);
      --kairos-text-muted: rgba(255, 255, 255, 0.6);
      --kairos-header-border: rgba(255, 255, 255, 0.08);
      --kairos-btn-secondary-bg: rgba(255, 255, 255, 0.06);
      --kairos-btn-secondary-text: rgba(255, 255, 255, 0.85);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --kairos-bg: #ffffff;
        --kairos-text: #1a1a1a;
        --kairos-surface: #f5f5f5;
        --kairos-surface-border: rgba(0, 0, 0, 0.08);
        --kairos-text-muted: rgba(0, 0, 0, 0.6);
        --kairos-header-border: rgba(0, 0, 0, 0.08);
        --kairos-btn-secondary-bg: rgba(0, 0, 0, 0.06);
        --kairos-btn-secondary-text: rgba(0, 0, 0, 0.85);
      }
    }

    body {
      width: 320px;
      padding: 16px;
      margin: 0;
      background: var(--kairos-bg);
      color: var(--kairos-text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--kairos-header-border);
    }

    .logo {
      width: 24px;
      height: 24px;
      margin-right: 10px;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
      background: linear-gradient(90deg, var(--kairos-accent-start), var(--kairos-accent-end));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background: var(--kairos-surface);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--kairos-surface-border);
    }

    .video-title {
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: rgba(255, 255, 255, 0.85);
    }

    .stats {
      font-size: 12px;
      color: var(--kairos-text-muted);
      margin-bottom: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      text-decoration: none;
      box-sizing: border-box;
      position: relative;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--kairos-accent-start);
      color: #fff;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.1);
      text-shadow: 0 1px 1px rgba(0,0,0,0.1);
    }

    .btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(79, 182, 200, 0.25);
    }

    .btn-secondary {
      background: var(--kairos-btn-secondary-bg);
      color: var(--kairos-btn-secondary-text);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .btn-accent {
      background: rgba(255, 255, 255, 0.05);
      color: var(--kairos-text);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-accent:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--kairos-text-muted);
    }

    .empty-state {
      text-align: center;
      color: var(--kairos-text-muted);
      font-size: 13px;
      padding: 20px 0;
    }
  </style>
</head>

<body>
  <div class="header">
    <img class="logo" src="icons/icon.png" alt="Kairos">
    <h1>Kairos</h1>
  </div>

  <div id="current-video-section" style="display: none;">
    <div class="card">
      <div class="video-title" id="video-title">Loading...</div>
      <div class="stats" id="note-count">0 notes collected</div>
      <button class="btn btn-primary" id="export-btn">
        Download Markdown
      </button>
    </div>
  </div>

  <div id="no-video-state" class="empty-state" style="display: none;">
    No active video detected.
  </div>

  <button class="btn btn-accent" id="dashboard-btn">
    My Notes & Settings
  </button>

  <script src="popup.js"></script>
</body>

</html>
